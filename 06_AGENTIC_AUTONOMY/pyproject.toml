[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-uav-mission-copilot"
version = "0.2.0"
description = "Deterministic offline UAV mission task planner"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
